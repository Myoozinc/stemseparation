name: Keep HuggingFace Space Alive

on:
  schedule:
    # Runs every 10 minutes, 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HuggingFace Space
        run: |
          echo "Pinging tinahmbuz/audiostems space..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://tinahmbuz-audiostems.hf.space)
          echo "Response status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "✅ Space is alive!"
          else
            echo "⚠️ Space returned status $STATUS — it may be waking up."
          fi
